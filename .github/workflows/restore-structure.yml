name: Restore project folders and test
on:
  push:
    paths: ['.github/workflows/restore-structure.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original folder layout
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          groups = {
            'docs': ['API_EXAMPLES.md','ASSIGNMENT.md','DATA_RULES.md','DEMO_8_MINUTES.md','FEATURE_GUIDE.md','GITHUB_SUBMISSION.md','PRESENTATION_SCRIPT_TH.md','REQUIREMENTS_MAP.md','WHAT_WE_ADDED.md','changes_from_uploaded_zip.json','source_comparison.json'],
            'src': ['core.py','server.py'],
            'scripts': ['prepare_data.py','verify_sources.py'],
            'tests': ['test_system.py','browser_smoke.cjs'],
            'web': ['app.js','features.js','index.html','style.css'],
            'test_results': ['results.csv','results.json','legacy_browser_results.json','ui_review.json','ui-request.png'],
            'data/cleaned': ['inventory.csv','products.csv','policies.csv','correction_log.csv','quarantine.csv','manifest.json','quality_summary.json'],
            'data/raw': ['inventory_snapshot.csv'],
            'data/generated': ['replenishment_policy.csv'],
          }
          moves = {name: folder+'/'+name for folder,names in groups.items() for name in names}
          moves.update({'products (1).csv':'data/raw/products.csv','download (4)':'.gitattributes','download (5)':'.gitignore','download':'data/runtime/.gitkeep','env.example':'.env.example','__init__.py':'src/__init__.py','__init__ (2).py':'scripts/__init__.py','__init__ (3).py':'tests/__init__.py','checks.yml':'docs/checks-template.yml'})
          # A rerun is safe: only move a source when its destination is absent.
          for source,destination in moves.items():
              src,dst=Path(source),Path(destination)
              if dst.exists():
                  continue
              if not src.exists():
                  raise SystemExit('Missing source: '+source)
              dst.parent.mkdir(parents=True,exist_ok=True)
              src.rename(dst)
          expected={'data/raw/products.csv':'2d2a12e8c33a829a4cf909685cd8c1feedf7f8929289f01b09751fd96cd81cd5','data/raw/inventory_snapshot.csv':'65c588f1c830dd761c74be1b6bf969b5fd593ce7988b95073608393d1139bfef'}
          for name,digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          readme=Path('README.md')
          heading='## Download and run locally'
          if heading not in readme.read_text(encoding='utf-8-sig'):
              intro=chr(10).join([heading,'','1. Click Code > Download ZIP, then extract the ZIP.','2. Install Python 3.10 or newer if needed.','3. Double-click START_WINDOWS_FIXED.bat.','4. Open http://127.0.0.1:8000 and keep the command window open.','','GitHub Pages cannot run this Python API or SQLite backend. Run the full application locally.','',''])
              readme.write_text(intro+readme.read_text(encoding='utf-8-sig'),encoding='utf-8')
          if not Path('index.html').exists():
              Path('index.html').write_text('<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BaanDee StockGuard</title><body style="font-family:system-ui;max-width:760px;margin:60px auto;padding:24px"><h1>BaanDee StockGuard</h1><p>This project runs with a Python API and SQLite. GitHub Pages displays this guide only.</p><h2>Run the application</h2><ol><li>Open the repository and choose Code &gt; Download ZIP.</li><li>Extract all files and install Python 3.10 or newer.</li><li>Double-click START_WINDOWS_FIXED.bat.</li><li>Open http://127.0.0.1:8000 and keep the command window open.</li></ol><p><a href="https://github.com/bfbnfh55/banndee">Repository and documentation</a></p></body></html>',encoding='utf-8')
      - name: Verify teacher source data
        run: python scripts/verify_sources.py
      - name: Run all system tests
        run: python tests/test_system.py
      - name: Save verified folder repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore project folders and document local startup"
            git push
          fi
