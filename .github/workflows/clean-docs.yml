name: Clean project documentation
on:
  push:
    paths: [".github/workflows/clean-docs.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep project documentation and remove preparation notes
        shell: python
        run: |
          from pathlib import Path
          import re
          for name in ['UPLOAD_TO_GITHUB_TH.md','START_HERE_TH.md','docs/GITHUB_SUBMISSION.md','docs/DEMO_8_MINUTES.md','docs/PRESENTATION_SCRIPT_TH.md','docs/checks-template.yml']:
              Path(name).unlink(missing_ok=True)
          p=Path('README.md')
          s=p.read_text(encoding='utf-8-sig')
          s=re.sub(r'\A## Download and run locally.*?(?=# BaanDee StockGuard)', '', s, flags=re.S)
          s=re.sub(r'## 11\. สมาชิกและบทบาท.*?(?=## 13\.)', '''## 11. สมาชิก
          
          | ชื่อ | รหัสนิสิต |
          |---|---|
          | นายกฤตภาส ศิริพร | 67011216037 |
          | นายชินวัตร แสนจันทร์ | 67011216022 |
          | นายสรวิชญ์ กรุณานำ | 67011216050 |
          | นายอภิวัฒชกร กลางโยธี | 67011216055 |
          
          การแบ่งบทบาทรายบุคคลยังไม่ได้รับการยืนยัน
          
          ''', s, flags=re.S)
          s=s.replace('## 13. รุ่นปรับปรุง Final Project','## 12. ฟีเจอร์เพิ่มเติม')
          s=s.replace('ก่อนนำเสนอให้ทีมซ้อมบนเครื่องที่จะใช้จริงอีกครั้ง','')
          s=s.replace('วิธี demo/API/GitHub และเกณฑ์งาน','ข้อมูล API และเกณฑ์งาน')
          s=re.sub(r'## เอกสารนำเสนอ.*', '''## เอกสารประกอบ
          
          - [แหล่งข้อมูลและส่วนที่พัฒนาเพิ่ม](docs/WHAT_WE_ADDED.md)
          - [กฎข้อมูล](docs/DATA_RULES.md)
          - [API](docs/API_EXAMPLES.md)
          - [ฟีเจอร์](docs/FEATURE_GUIDE.md)
          - [สไลด์](https://canva.link/ajr69bo95yfoclk)
          ''', s, flags=re.S)
          s=s.replace('ตรวจหน้าจอจริงผ่าน Codex in-app browser แล้ว:', 'ผลการตรวจหน้าจอ:')
          p.write_text(s,encoding='utf-8')
          Path('AI_USE.md').write_text('''# การใช้ AI ในโครงงาน
          
          ## เครื่องมือและขอบเขต
          ใช้ ChatGPT (Codex) ช่วยวิเคราะห์โจทย์ ออกแบบระบบ สร้างข้อมูลนโยบายสังเคราะห์ เขียนและปรับโค้ด Python/SQL/HTML/CSS/JavaScript สร้างชุดทดสอบ และจัดทำเอกสาร
          
          ## การตรวจสอบผล
          ตรวจข้อมูลดิบเทียบ SHA-256 กับต้นฉบับ รันกระบวนการทำความสะอาดข้อมูล ทดสอบ HTTP/backend 30 กรณี และตรวจหน้าจอ ผลอยู่ใน test_results/ และ GitHub Actions ผลเหล่านี้เป็นการตรวจในสภาพแวดล้อมพัฒนา ไม่ใช่ผลทดลองกับผู้ใช้จริง
          
          ## การตัดสินใจของสมาชิก
          ผู้ใช้กำหนดบริบท Final Project ขอระบบที่ต่อยอดจากข้อมูลอาจารย์ และให้รายชื่อสมาชิก ขอบเขตการตรวจและการตัดสินใจรายบุคคลยังไม่ได้รับการยืนยัน จึงไม่มีการระบุว่าใครเป็นผู้พัฒนาส่วนใดโดยลำพัง
          
          ## การทำงานของผลิตภัณฑ์
          ระบบไม่มีการเรียก LLM หรือ API โมเดลขณะใช้งาน ใช้กฎขั้นต่ำ–เป้าหมายในการแนะนำเติมสินค้า เพราะคำนวณซ้ำและตรวจสอบเหตุผลได้ ไม่ต้องใช้ API key
          ''',encoding='utf-8')
          p=Path('docs/WHAT_WE_ADDED.md'); s=p.read_text(encoding='utf-8-sig')
          s=re.sub(r'\A.*?(?=## 1\.)','# แหล่งข้อมูลและส่วนที่พัฒนาเพิ่ม\n\n',s,flags=re.S)
          s=s.replace(' ไม่ควรนำเสนอว่าทีมสร้างข้อมูล BaanDee ดั้งเดิมเอง','')
          s=s.replace('## 2. ของโครงงานที่มีอยู่ใน ZIP StockGuard เดิมแล้ว','## 2. องค์ประกอบหลักของ StockGuard')
          s=s.replace('## 3. สิ่งที่เพิ่ม/แก้ในรอบนี้ (24 ต.ค. 2026)','## 3. ฟีเจอร์เพิ่มเติม')
          s=s.replace(' ตารางนี้อ้างอิงไฟล์จริง ไม่อ้างข้อความในแชตเป็นหลักฐาน','')
          s=s.replace('## 4. ปัญหาข้อมูลที่ควรยกตัวอย่าง 3 แบบ','## 4. ตัวอย่างปัญหาคุณภาพข้อมูล')
          s=re.sub(r'ทั้งสามกรณีเป็นข้อผิดพลาด.*?\n','ทั้งสามกรณีเป็นกรณีทดสอบที่สร้างในข้อมูลนโยบายใหม่ ส่วนข้อมูลสินค้าต้นฉบับมีหมวดหมู่ตัวพิมพ์ต่างกัน เช่น kitchen/bedding/storage\n',s)
          s=s.split('## 5.')[0]
          p.write_text(s,encoding='utf-8')
          p=Path('docs/REQUIREMENTS_MAP.md'); lines=p.read_text(encoding='utf-8-sig').splitlines()
          lines=[line for line in lines if not any(word in line for word in ['GITHUB_SUBMISSION','DEMO_8_MINUTES','ความพร้อมของโค้ด','ยังต้องทำโดยทีม:'])]
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          p=Path('docs/FEATURE_GUIDE.md'); s=p.read_text(encoding='utf-8-sig')
          s=re.sub(r'ไม่เพิ่ม AI เพียงเพื่อให้มีฟีเจอร์.*','',s)
          p.write_text(s,encoding='utf-8')
          
      - name: Save documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove preparation notes and simplify project documentation"
            git push
          fi
